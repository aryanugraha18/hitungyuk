<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warung & Kebun Hitung</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--hijau:#3fa34d;--hijau-tua:#2b7a37;--kuning:#ffd23f;--oranye:#ff8c42;--merah:#e94f37;--biru:#3a86ff;--tanah:#8b5a2b;--teks:#3b2f2f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(#bfe9ff,#e8f8d8 55%,#d9f0c4);background-attachment:fixed;color:var(--teks);user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
input,select{font-family:inherit;user-select:text;-webkit-user-select:text}
.app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:12px}
header{display:flex;align-items:center;gap:8px}
#judul{flex:1;text-align:center;font-weight:800;font-size:1.25rem;color:var(--hijau-tua)}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:1.2rem;box-shadow:0 3px 0 rgba(0,0,0,.12);white-space:nowrap}
.iconbtn{background:#fff;border-radius:50%;width:50px;height:50px;font-size:1.5rem;box-shadow:0 3px 0 rgba(0,0,0,.15);flex:none}
.hide{visibility:hidden}
.iconbtn:active,.big:active,.opt:active,.card:active{transform:translateY(3px);box-shadow:none}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
h1{text-align:center;font-size:2.1rem;margin:14px 0 0;color:var(--hijau-tua);line-height:1.1}
.sub{text-align:center;margin:4px 0 18px;font-size:1.15rem}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border-radius:26px;padding:18px 8px;text-align:center;font-size:1.45rem;font-weight:800;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.card .em{font-size:4.2rem;display:block;line-height:1.15}
.card small{display:block;font-weight:600;font-size:1rem;opacity:.95}
.card .lv{display:inline-block;background:rgba(255,255,255,.3);border-radius:999px;padding:0 10px;margin-top:6px;font-size:.95rem}
.kebun{background:var(--hijau)}
.pasar{background:var(--biru);grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:14px;text-align:left}
.pasar .em{font-size:3.6rem}
/* pasar ikan */
.kolam{position:relative;width:min(100%,420px);min-height:190px;border-radius:40% 45% 42% 48%/30% 30% 35% 35%;background:radial-gradient(ellipse at 50% 40%,#6ec6ff,#1e88e5);display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px 10px;padding:26px 30px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15),0 5px 0 #4e8a3a}
.ikan{background:none;font-size:2.3rem;padding:0;line-height:1.1;animation:renang 2.4s ease-in-out infinite alternate}
.ikan:nth-child(3n){animation-duration:3s}.ikan:nth-child(3n+1){animation-delay:-1s}.ikan:nth-child(2n){animation-direction:alternate-reverse}
@keyframes renang{from{transform:translateX(-8px) rotate(-6deg)}to{transform:translateX(8px) rotate(6deg)}}
.ember{min-width:130px;min-height:90px;background:linear-gradient(#90a4ae,#607d8b);border-radius:10px 10px 40px 40px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px;padding:10px 12px;border-top:8px solid #455a64;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.ember .ikan{animation:none;font-size:1.9rem}
button.ember{width:min(44vw,180px);min-height:150px}
button.ember.salah{animation:geleng .4s}
button.ember.benar{outline:6px solid #7ee07a}
.meja{display:flex;gap:16px;align-items:flex-end;justify-content:center;flex-wrap:wrap;background:#fff;border-radius:20px;padding:16px 12px 10px;border-bottom:10px solid #b07c3f;width:min(100%,460px)}
.meja .ikan{animation:none;position:relative}
.meja .ikan.ok{opacity:.55}
.meja .ikan.ok::after{content:attr(data-no);position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--hijau);color:#fff;border-radius:50%;font-size:.9rem;font-weight:800;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.meja .ikan.salah{animation:geleng .4s}
.warung{background:var(--oranye)}
.mini{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.big{background:var(--kuning);font-weight:800;font-size:1.3rem;border-radius:18px;padding:12px 22px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big.biru{background:var(--biru);color:#fff}
.big.putih{background:#fff}
.big.merah{background:var(--merah);color:#fff}
.big:disabled{opacity:.45;cursor:default}
.soal{background:#fff;border-radius:22px;padding:12px 14px;margin:12px 0 4px;text-align:center;font-size:1.5rem;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.08);line-height:1.3}
.soal b{color:var(--merah);font-size:1.15em}
#prog{text-align:center;font-size:1.1rem;letter-spacing:4px;color:var(--hijau-tua);margin-bottom:6px}
.panggung{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:20px}
.opsi{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.opt{min-width:88px;padding:8px 18px;font-size:2.1rem;font-weight:800;border-radius:20px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.opt.rp{font-size:1.5rem}
.opt.salah{background:#ffd6d0;animation:geleng .4s}
.opt.benar{background:#b9efb5}
@keyframes geleng{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes muncul{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.petunjuk{font-size:1rem;opacity:.8}
.label{font-weight:700;font-size:1.05rem;align-self:stretch;text-align:center;margin-bottom:-6px}
/* kebun */
.lahan{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:#a0703c;padding:12px;border-radius:20px;width:min(100%,380px)}
.petak{width:100%;aspect-ratio:1;border-radius:14px;background:var(--tanah);font-size:2.2rem;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 4px 0 rgba(0,0,0,.25);padding:0}
.petak:not(:empty){animation:muncul .25s}
.baris{display:flex;gap:16px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.pohon{display:flex;flex-direction:column;align-items:center}
.daun{background:radial-gradient(circle at 35% 30%,#7bd67f,#43a047);border-radius:48% 52% 45% 55%/55% 50% 50% 45%;width:min(280px,82vw);min-height:170px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;padding:26px 18px;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.pohon.kecil .daun{width:min(170px,42vw);min-height:130px;padding:20px 10px}
.batang{width:36px;height:54px;background:var(--tanah);border-radius:0 0 8px 8px}
.buah{background:none;font-size:2.2rem;position:relative;padding:0 2px;line-height:1.1}
.pohon.kecil .buah{font-size:1.8rem}
.buah.dihitung{opacity:.75}
.buah.dihitung::after{content:attr(data-no);position:absolute;top:-6px;right:-8px;background:var(--biru);color:#fff;border-radius:50%;font-size:.85rem;font-weight:800;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.buah.dimakan{opacity:.3;filter:grayscale(1)}
.buah.dimakan::after{content:'✖';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--merah);font-size:1.6rem;opacity:1}
.burung{font-size:2.6rem;margin-bottom:-14px}
.plus{font-size:2.5rem;font-weight:800;align-self:center}
/* warung */
.toko{background:#fff;border-radius:20px;padding:10px;width:100%;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.rak,.keranjang,.dompet,.nampan{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;min-height:70px;border-radius:18px;padding:10px;width:100%}
.rak{background:#f3d9b1;border-bottom:8px solid #b07c3f}
.keranjang{background:#fff3c4;border:3px dashed #e0b300}
.dompet{background:#e6f0ff}
.nampan{background:#fff;border:3px dashed #9db8e6}
.barang{background:none;font-size:2.3rem;padding:0 2px}
.barang:active{transform:scale(.9)}
.etalase{display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:20px;padding:8px 22px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.etalase .em{font-size:4rem;line-height:1.1}
.tag{background:var(--merah);color:#fff;font-weight:800;border-radius:10px;padding:2px 12px;font-size:1.3rem}
.koin{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a8,#e5b80b);border:3px solid #b98f00;font-weight:800;font-size:1.05rem;color:#5a4300;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.koin.p500{background:radial-gradient(circle at 35% 30%,#ffffff,#c7ccd1);border-color:#8a9299;color:#3d4246}
.kertas{width:104px;height:56px;border-radius:8px;font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 rgba(0,0,0,.18);border:2px solid rgba(0,0,0,.2)}
.kertas.p2000{background:linear-gradient(135deg,#d6dde3,#9fb0bd);color:#26323b}
.kertas.p5000{background:linear-gradient(135deg,#e3c19a,#b5835a);color:#3d2610}
.koin.kecil{width:50px;height:50px;font-size:.85rem}
.kertas.kecil{width:80px;height:44px;font-size:.95rem}
.total{font-size:1.4rem;font-weight:700}
.orang{font-size:3.4rem;line-height:1}
.bayarku{font-size:1.3rem;font-weight:700;background:#fff;border-radius:16px;padding:6px 16px}
/* overlay */
#overlay{position:fixed;inset:0;background:rgba(30,40,30,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#overlay.on{display:flex}
#ovbox{background:#fffdf5;border-radius:28px;padding:20px 22px;max-width:420px;width:100%;text-align:center;animation:muncul .25s;max-height:92vh;overflow:auto}
#ovbox h2{margin:4px 0;font-size:2rem;color:var(--hijau-tua)}
#ovbox p{font-size:1.15rem;margin:8px 0}
.ovemoji{font-size:4rem;line-height:1.1}
.note{background:#fff3c4;border-radius:14px;padding:6px}
.hitung{font-size:3rem;font-weight:800;color:var(--biru)}
.inp{font-size:1.6rem;width:140px;text-align:center;border-radius:14px;border:3px solid #ccc;padding:4px}
.err{color:var(--merah);min-height:1.2em}
/* stiker & ortu */
.grid-stiker{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:#fff;border-radius:22px;padding:14px}
.slot{aspect-ratio:1;border-radius:16px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.slot.dapat{background:#fff3c4;animation:muncul .3s}
.slot.kunci{font-size:1.4rem;opacity:.4}
.panel{background:#fff;border-radius:22px;padding:14px 16px;margin-top:12px;font-size:1.05rem}
.panel h3{margin:0 0 6px;color:var(--hijau-tua)}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:6px;border-bottom:1px solid #eee;text-align:center}
.tbl td:first-child{text-align:left}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee}
.set select{font-size:1rem;padding:4px;border-radius:10px}
.kecilteks{font-size:.95rem;opacity:.8}
.kredit{margin-top:auto;padding-top:24px;text-align:center;font-size:.95rem;opacity:.7}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="iconbtn hide" id="btnHome" onclick="keBeranda()" aria-label="Beranda">🏠</button>
    <div id="judul">Warung & Kebun Hitung</div>
    <div class="pill" id="bintang">⭐ 0</div>
    <button class="iconbtn hide" id="btnUlang" onclick="speak(ucapan)" aria-label="Ulangi suara">🔊</button>
  </header>

  <!-- BERANDA -->
  <section class="screen on" id="home">
    <h1>Halo! 👋</h1>
    <p class="sub">Mau main di mana hari ini?</p>
    <div class="menu">
      <button class="card kebun" onclick="mulai('kebun')"><span class="em">🌳</span>Kebun Hitung<small>Tanam, hitung, panen</small><span class="lv" id="lvKebun">Level 1</span></button>
      <button class="card warung" onclick="mulai('warung')"><span class="em">🏪</span>Warung Mini<small>Jual, beli, bayar</small><span class="lv" id="lvWarung">Level 1</span></button>
      <button class="card pasar" onclick="mulai('pasar')"><span class="em">🐟</span><span>Pasar Ikan<small>Tangkap, banding, urutkan, jual</small><span class="lv" id="lvPasar">Level 1</span></span></button>
    </div>
    <div class="mini">
      <button class="big putih" onclick="bukaStiker()">🎁 Stikerku</button>
      <button class="big putih" onclick="gerbang()">👪 Orang Tua</button>
    </div>
    <p class="kredit">Developed by <b>Arya Nugraha</b></p>
  </section>

  <!-- PERMAINAN -->
  <section class="screen" id="game">
    <div class="soal" id="soal"></div>
    <div id="prog"></div>
    <div class="panggung" id="panggung"></div>
  </section>

  <!-- STIKER -->
  <section class="screen" id="stiker">
    <h1>🎁 Koleksi Stiker</h1>
    <p class="sub" id="stikerInfo"></p>
    <div class="grid-stiker" id="gridStiker"></div>
  </section>

  <!-- ORANG TUA -->
  <section class="screen" id="ortu">
    <h1>👪 Halaman Orang Tua</h1>
    <div id="ortuIsi"></div>
  </section>
</div>

<div id="overlay"><div id="ovbox"></div></div>

<script>
/* ---------- utilitas ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const angkaID=n=>n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const rp=n=>'Rp'+angkaID(n);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function P(){const p=$('#panggung');p.innerHTML='';return p}
function tglKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

function terbilang(n){
  const s=['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
  if(n<12)return s[n];
  if(n<20)return s[n-10]+' belas';
  if(n<100)return s[Math.floor(n/10)]+' puluh'+(n%10?' '+s[n%10]:'');
  if(n<200)return 'seratus'+(n-100?' '+terbilang(n-100):'');
  if(n<1000)return s[Math.floor(n/100)]+' ratus'+(n%100?' '+terbilang(n%100):'');
  if(n<2000)return 'seribu'+(n-1000?' '+terbilang(n-1000):'');
  if(n<1000000)return terbilang(Math.floor(n/1000))+' ribu'+(n%1000?' '+terbilang(n%1000):'');
  return String(n);
}

/* ---------- penyimpanan ---------- */
const KEY='warungKebunHitung_v1';
const STIKER=['🐟','🦋','🐢','🌻','🐓','🍉','🚜','🐐','🌈','🐞','🦆','🍌','🐇','🚲','🐘','🌽','🦜','🐠','🍓','🏆'];
const BAWAAN={bintang:0,stiker:0,suara:true,batas:15,level:{kebun:1,warung:1,pasar:1},stat:{kebun:{b:0,s:0},warung:{b:0,s:0},pasar:{b:0,s:0}},detik:{}};
let state=JSON.parse(JSON.stringify(BAWAAN));
try{const s=JSON.parse(localStorage.getItem(KEY));if(s){state=Object.assign(state,s);state.level=Object.assign({},BAWAAN.level,s.level);state.stat=Object.assign(JSON.parse(JSON.stringify(BAWAAN.stat)),s.stat)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

/* ---------- suara ---------- */
let suaraID=null,ucapan='';
function muatSuara(){try{suaraID=speechSynthesis.getVoices().find(v=>/^id/i.test(v.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=muatSuara;muatSuara()}catch(e){}
function speak(t){if(!state.suara||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';if(suaraID)u.voice=suaraID;u.rate=.9;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
let actx;
function bunyi(j){if(!state.suara)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const nada=j==='benar'?[523,659,784,1047]:j==='salah'?[330,247]:[700];const t0=actx.currentTime;nada.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=t0+i*.1;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.2)})}catch(e){}}

/* ---------- layar ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));$('#btnHome').classList.toggle('hide',id==='home');$('#btnUlang').classList.toggle('hide',id!=='game');if(id!=='game')$('#judul').textContent='Warung & Kebun Hitung';window.scrollTo(0,0)}
function updateHeader(){$('#bintang').textContent='⭐ '+state.bintang;$('#lvKebun').textContent='Level '+state.level.kebun;$('#lvWarung').textContent='Level '+state.level.warung;$('#lvPasar').textContent='Level '+state.level.pasar}
function keBeranda(){try{speechSynthesis.cancel()}catch(e){}tutup();updateHeader();show('home')}
function overlay(h){$('#ovbox').innerHTML=h;$('#overlay').classList.add('on')}
function tutup(){$('#overlay').classList.remove('on')}
function setSoal(tampil,ucap){$('#soal').innerHTML=tampil;ucapan=ucap;speak(ucap)}

/* ---------- alur permainan ---------- */
const PER_RONDE=5;
let mode=null,ronde=0,beruntun=0,salahBeruntun=0,terkunci=false,terakhir=null;
function mulai(m){mode=m;ronde=0;beruntun=0;salahBeruntun=0;show('game');$('#judul').textContent={kebun:'🌳 Kebun Hitung',warung:'🏪 Warung Mini',pasar:'🐟 Pasar Ikan'}[m];soalBaru()}
function soalBaru(){
  terkunci=false;const lv=state.level[mode];
  const daftar=mode==='kebun'
    ?(lv===1?[kebunTanam,kebunHitung]:[kebunTanam,kebunHitung,kebunTambah,kebunKurang])
    :mode==='warung'
    ?(lv===1?[warungAmbil,warungBayar]:lv===2?[warungAmbil,warungBayar,warungTotal]:[warungAmbil,warungBayar,warungTotal,warungKembalian])
    :(lv===1?[pasarTangkap,pasarBanding,pasarUrut,pasarBayar]:[pasarTangkap,pasarBanding,pasarUrut,pasarBayar,pasarHarga]);
  let f;do{f=pick(daftar)}while(daftar.length>1&&f===terakhir);terakhir=f;
  $('#prog').textContent='●'.repeat(ronde)+'○'.repeat(PER_RONDE-ronde);
  f(lv);
}
function jawab(benar,pesan){
  if(terkunci)return;
  if(benar){
    terkunci=true;state.stat[mode].b++;state.bintang++;beruntun++;salahBeruntun=0;ronde++;
    let naik=false,stikerBaru=false;
    if(beruntun>=3&&state.level[mode]<3){state.level[mode]++;beruntun=0;naik=true}
    if(Math.floor(state.bintang/5)>state.stiker&&state.stiker<STIKER.length){state.stiker++;stikerBaru=true}
    save();updateHeader();bunyi('benar');
    $('#prog').textContent='●'.repeat(ronde)+'○'.repeat(Math.max(0,PER_RONDE-ronde));
    setTimeout(()=>puji(naik,stikerBaru),700);
  }else{
    state.stat[mode].s++;salahBeruntun++;beruntun=0;
    if(salahBeruntun>=3&&state.level[mode]>1){state.level[mode]--;salahBeruntun=0}
    save();bunyi('salah');
    speak(pesan||pick(['Hampir! Coba lagi ya.','Belum tepat, ayo coba lagi.','Coba hitung pelan-pelan ya.']));
  }
}
function puji(naik,stikerBaru){
  const selesai=ronde>=PER_RONDE,kata=pick(['Hebat!','Pintar!','Keren!','Betul sekali!','Mantap!']);
  let h=`<div class="ovemoji">${pick(['🎉','🌟','👏','🥳'])}</div><h2>${kata}</h2><p>+1 ⭐</p>`;
  if(naik)h+=`<p class="note">🚀 Naik ke Level ${state.level[mode]}!</p>`;
  if(stikerBaru)h+=`<p class="note">🎁 Stiker baru: <span style="font-size:2.4rem">${STIKER[state.stiker-1]}</span></p>`;
  if(selesai)h+=`<p>Ronde selesai! Kamu sudah menjawab ${PER_RONDE} soal. 🏅</p><div class="mini"><button class="big" onclick="tutup();mulai(mode)">🔁 Main lagi</button><button class="big putih" onclick="keBeranda()">🏠 Beranda</button></div>`;
  else h+=`<button class="big biru" onclick="tutup();soalBaru()">Lanjut ▶</button>`;
  overlay(h);
  speak(kata+(naik?' Kamu naik level!':'')+(stikerBaru?' Kamu dapat stiker baru!':'')+(selesai?' Ronde selesai!':''));
}
function opsiAngka(n,step=1,min=0){const s=new Set([n]);let g=0;while(s.size<3&&g++<60){const v=n+pick([-2,-1,1,2])*step;if(v>=min)s.add(v)}return shuffle([...s])}
function tombolOpsi(p,opsi,benar,fmt=x=>x,isRp=false){
  const w=el('div','opsi');
  opsi.forEach(v=>{const b=el('button','opt'+(isRp?' rp':''),fmt(v));
    b.onclick=()=>{if(terkunci)return;if(v===benar){b.classList.add('benar');jawab(true)}else{b.classList.add('salah');setTimeout(()=>b.classList.remove('salah'),450);jawab(false)}};
    w.append(b)});
  p.append(w);
}

/* ---------- KEBUN HITUNG ---------- */
const BUAH=['🍎','🍊','🥭','🍐','🍋','🍑'];
function pohon(n,buah,{dimakan=0,kecil=false}={}){
  const w=el('div','pohon'+(kecil?' kecil':'')),daun=el('div','daun');let hit=0;
  for(let i=0;i<n;i++){const b=el('button','buah',buah);
    if(i>=n-dimakan){b.classList.add('dimakan');b.disabled=true}
    else b.onclick=()=>{if(b.dataset.no)return;hit++;b.dataset.no=hit;b.classList.add('dihitung');bunyi('klik');speak(terbilang(hit))};
    daun.append(b)}
  w.append(daun,el('div','batang'));return w;
}
function kebunTanam(lv){
  const n=rnd(2,lv===1?5:10),jml=lv===1?10:15;
  setSoal(`Tanam <b>${n}</b> bibit 🌱`,`Ayo tanam ${terbilang(n)} bibit di kebun! Ketuk tanahnya.`);
  const p=P(),lahan=el('div','lahan');let c=0;
  for(let i=0;i<jml;i++){const t=el('button','petak','');
    t.onclick=()=>{if(terkunci)return;if(t.textContent){t.textContent='';c--}else{t.textContent='🌱';c++}bunyi('klik');speak(terbilang(c))};
    lahan.append(t)}
  const b=el('button','big biru','💧 Siram & Cek');
  b.onclick=()=>{if(terkunci)return;
    if(c===n){lahan.querySelectorAll('.petak').forEach(x=>{if(x.textContent)x.textContent=pick(['🌻','🌽','🍅','🥬','🥕'])});jawab(true)}
    else jawab(false,`Kamu menanam ${terbilang(c)} bibit. `+(c<n?'Masih kurang, tambah lagi ya.':'Kebanyakan, ambil sebagian ya.'))};
  p.append(lahan,el('div','petunjuk','👆 Ketuk tanah untuk menanam, ketuk lagi untuk mencabut'),b);
}
function kebunHitung(lv){
  const n=rnd(1,lv===1?5:lv===2?10:15),f=pick(BUAH);
  setSoal(`Ada berapa ${f} di pohon?`,'Ada berapa buah di pohon? Ketuk buahnya sambil menghitung.');
  const p=P();p.append(pohon(n,f),el('div','petunjuk','👆 Ketuk buah untuk menghitung'));
  tombolOpsi(p,opsiAngka(n,1,1),n);
}
function kebunTambah(lv){
  const maks=lv===2?10:18,a=rnd(1,Math.min(9,maks-1)),b=rnd(1,Math.min(9,maks-a)),f=pick(BUAH);
  setSoal(`${a} ${f} + ${b} ${f} = ?`,`Pohon kiri punya ${terbilang(a)} buah. Pohon kanan punya ${terbilang(b)} buah. Kalau dipanen semua, ada berapa buah?`);
  const p=P(),r=el('div','baris');r.append(pohon(a,f,{kecil:true}),el('div','plus','+'),pohon(b,f,{kecil:true}));
  p.append(r,el('div','petunjuk','🧺 Panen semua! Ketuk buah untuk menghitung'));
  tombolOpsi(p,opsiAngka(a+b,1,1),a+b);
}
function kebunKurang(lv){
  const n=rnd(3,lv===2?10:15),k=rnd(1,n-1),f=pick(BUAH);
  setSoal(`${n} ${f} − ${k} dimakan burung = ?`,`Ada ${terbilang(n)} buah. Burung memakan ${terbilang(k)} buah. Sisa berapa buah?`);
  const p=P();p.append(el('div','burung','🐦 nyam!'),pohon(n,f,{dimakan:k}),el('div','petunjuk','✖ = dimakan burung. Hitung yang masih ada'));
  tombolOpsi(p,opsiAngka(n-k,1,0),n-k);
}

/* ---------- WARUNG MINI ---------- */
const DAGANGAN=[['🥚','telur'],['🍞','roti'],['🍌','pisang'],['🍊','jeruk'],['🧃','jus'],['🍬','permen'],['🥕','wortel']];
const PEMBELI=['👩','👨','👵','👴','🧕','🧒','👧'];
const BARANG=[['🍬','permen',500],['🍭','lolipop',1000],['🍌','pisang',1500],['🥚','telur',2000],['🧃','jus',2500],['🍞','roti',3000],['✏️','pensil',3500],['🥛','susu',4000],['🍦','es krim',5000],['📒','buku',6000],['🍉','semangka',7500],['🧸','boneka',10000]];
function uangBtn(v,kecil){const kertas=v>=2000;return el('button',(kertas?'kertas':'koin')+' p'+v+(kecil?' kecil':''),angkaID(v))}
function warungAmbil(lv){
  const n=rnd(1,lv===1?5:lv===2?10:12),[e,nama]=pick(DAGANGAN),org=pick(PEMBELI),isi=lv===1?8:14;
  setSoal(`<span class="orang">${org}</span><br>"Saya mau beli <b>${n}</b> ${nama} ${e}"`,`Halo! Saya mau beli ${terbilang(n)} ${nama}.`);
  const p=P(),rak=el('div','rak'),kj=el('div','keranjang');let di=0;
  for(let i=0;i<isi;i++){const b=el('button','barang',e);
    b.onclick=()=>{if(terkunci)return;if(b.parentNode===rak){kj.append(b);di++}else{rak.append(b);di--}bunyi('klik');speak(terbilang(di))};
    rak.append(b)}
  const ok=el('button','big biru','🛍️ Berikan');
  ok.onclick=()=>{if(terkunci)return;if(di===n)jawab(true);else jawab(false,`Di keranjang ada ${terbilang(di)} ${nama}. `+(di<n?'Masih kurang.':'Kebanyakan.'))};
  p.append(el('div','label','🗄️ Rak warung (ketuk untuk masukkan)'),rak,el('div','label','🛒 Keranjang (ketuk untuk kembalikan)'),kj,ok);
}
function warungBayar(lv,daftar=BARANG){
  const maks=[0,3000,5000,10000][lv],[e,nama,h]=pick(daftar.filter(x=>x[2]>=1000&&x[2]<=maks));
  const uang=lv===1?[500,1000]:lv===2?[500,1000,2000]:[500,1000,2000,5000];
  setSoal(`Beli ${nama}, harganya <b>${rp(h)}</b>`,`Kamu mau beli ${nama}. Harganya ${terbilang(h)} rupiah. Ayo bayar dengan uang yang pas!`);
  const p=P(),et=el('div','etalase',`<span class="em">${e}</span><span class="tag">${rp(h)}</span>`);
  const dompet=el('div','dompet'),nampan=el('div','nampan'),tot=el('div','total');let sum=0;
  const upd=()=>tot.innerHTML='Uang dibayar: <b>'+rp(sum)+'</b>';
  uang.forEach(v=>{const b=uangBtn(v);b.onclick=()=>{if(terkunci)return;sum+=v;
    const m=uangBtn(v,true);m.onclick=()=>{if(terkunci)return;sum-=v;m.remove();upd();bunyi('klik')};
    nampan.append(m);upd();bunyi('klik');speak(terbilang(sum)+' rupiah')};dompet.append(b)});
  upd();
  const ok=el('button','big biru','💸 Bayar');
  ok.onclick=()=>{if(terkunci)return;if(sum===h)jawab(true);else if(sum<h)jawab(false,`Uangnya masih kurang ${terbilang(h-sum)} rupiah.`);else jawab(false,'Uangnya kelebihan. Ambil lagi sebagian ya.')};
  p.append(et,el('div','label','👛 Dompetmu (ketuk uang)'),dompet,el('div','label','🧾 Uang yang diberikan (ketuk untuk ambil lagi)'),nampan,tot,ok);
}
function warungTotal(lv){
  const pil=BARANG.filter(x=>x[2]<=(lv===2?3000:5000)),a=pick(pil),b=pick(pil.filter(x=>x!==a)),t=a[2]+b[2];
  setSoal(`Berapa harga semuanya?`,`Ibu membeli ${a[1]} harganya ${terbilang(a[2])} rupiah, dan ${b[1]} harganya ${terbilang(b[2])} rupiah. Berapa harga semuanya?`);
  const p=P(),r=el('div','baris');
  r.append(el('div','etalase',`<span class="em">${a[0]}</span><span class="tag">${rp(a[2])}</span>`),el('div','plus','+'),el('div','etalase',`<span class="em">${b[0]}</span><span class="tag">${rp(b[2])}</span>`));
  p.append(el('div','orang',pick(PEMBELI)),r);
  tombolOpsi(p,opsiAngka(t,500,500),t,rp,true);
}
function warungKembalian(){
  const [e,nama,h]=pick(BARANG.filter(x=>x[2]<=4000)),k=5000-h;
  setSoal(`Bayar <b>${rp(5000)}</b>, kembaliannya berapa?`,`Kamu beli ${nama} harganya ${terbilang(h)} rupiah. Kamu bayar dengan uang lima ribu. Berapa kembaliannya?`);
  const p=P(),r=el('div','baris'),uang=el('div','etalase');uang.append(uangBtn(5000));uang.append(el('span','kecilteks','uangmu'));
  r.append(el('div','etalase',`<span class="em">${e}</span><span class="tag">${rp(h)}</span>`),uang);
  p.append(r,el('div','petunjuk','💡 Hitung maju dari harga sampai Rp5.000'));
  tombolOpsi(p,opsiAngka(k,500,500),k,rp,true);
}

/* ---------- PASAR IKAN ---------- */
const JENIS_IKAN=[['🐟','ikan nila'],['🐠','ikan hias'],['🐡','ikan buntal'],['🦐','udang'],['🦀','kepiting']];
const DAGANGAN_IKAN=[['🦐','udang',1000],['🐟','ikan lele',2000],['🐟','ikan nila',2500],['🦑','cumi',3000],['🐟','ikan patin',4000],['🦀','kepiting',5000],['🐟','ikan gurame',7000],['🐟','ikan kakap',10000]];
function pasarBayar(lv){warungBayar(lv,DAGANGAN_IKAN)}
function pasarTangkap(lv){
  const campur=lv>1,[t,namaT]=lv===1?JENIS_IKAN[0]:pick(JENIS_IKAN),lain=pick(JENIS_IKAN.filter(x=>x[0]!==t));
  const n=rnd(1,lv===1?5:lv===2?7:10),jmlT=n+rnd(1,3),jmlL=campur?rnd(2,5):0;
  setSoal(`Tangkap <b>${n}</b> ${t} ke ember`,`Ayo tangkap ${terbilang(n)} ${namaT}! Ketuk ${namaT} untuk dimasukkan ke ember.`);
  const p=P(),kolam=el('div','kolam'),ember=el('div','ember');
  const ikan=shuffle([...Array(jmlT).fill(t),...Array(jmlL).fill(lain[0])]);
  const hitung=()=>[...ember.children].filter(x=>x.textContent===t).length;
  ikan.forEach(f=>{const b=el('button','ikan',f);b.onclick=()=>{if(terkunci)return;(b.parentNode===kolam?ember:kolam).append(b);bunyi('klik');speak(f===t?terbilang(hitung())+' '+namaT:'Eh, itu '+lain[1])};kolam.append(b)});
  const ok=el('button','big biru','🪣 Selesai');
  ok.onclick=()=>{if(terkunci)return;const c=hitung(),salahJenis=ember.children.length-c;
    if(salahJenis)jawab(false,`Ada ${lain[1]} di ember. Kembalikan ke kolam ya.`);
    else if(c===n)jawab(true);
    else jawab(false,`Di ember ada ${terbilang(c)} ${namaT}. `+(c<n?'Masih kurang.':'Kebanyakan.'))};
  p.append(kolam,el('div','petunjuk','👆 Ketuk ikan untuk ditangkap, ketuk di ember untuk dilepas'),ember,ok);
}
function pasarBanding(lv){
  const maks=lv===1?6:lv===2?10:15,a=rnd(1,maks);let b;do{b=rnd(1,maks)}while(b===a||(lv===3&&Math.abs(a-b)>3));
  const banyak=lv===1||Math.random()<.5,f=pick(JENIS_IKAN),benar=banyak?(a>b?0:1):(a<b?0:1);
  const kata=banyak?'lebih banyak':'lebih sedikit';
  setSoal(`Ember mana yang ${f[0]} nya <b>${kata}</b>?`,`Ember mana yang ${f[1]}nya ${kata}?`);
  const p=P(),r=el('div','baris');
  [a,b].forEach((n,i)=>{const e=el('button','ember');e.innerHTML=Array(n).fill(`<span class="ikan">${f[0]}</span>`).join('');
    e.onclick=()=>{if(terkunci)return;if(i===benar){e.classList.add('benar');jawab(true)}else{e.classList.add('salah');setTimeout(()=>e.classList.remove('salah'),450);jawab(false,'Coba hitung isi kedua ember ya.')}};r.append(e)});
  p.append(r,el('div','petunjuk','👆 Ketuk embernya'));
}
function pasarUrut(lv){
  const k=lv+2,f=pick(JENIS_IKAN),ukuran=[1.4,2,2.7,3.4,4.2].slice(0,k);let next=0;
  setSoal(`Urutkan ${f[0]} dari yang <b>paling kecil</b>`,`Ketuk ${f[1]} mulai dari yang paling kecil sampai yang paling besar.`);
  const p=P(),meja=el('div','meja');
  shuffle(ukuran.map((u,i)=>[u,i])).forEach(([u,i])=>{const b=el('button','ikan',f[0]);b.style.fontSize=u+'rem';
    b.onclick=()=>{if(terkunci||b.classList.contains('ok'))return;
      if(i===next){next++;b.classList.add('ok');b.dataset.no=next;bunyi('klik');if(next===k)jawab(true);else speak(next===1?'Betul, paling kecil!':'Betul!')}
      else{b.classList.add('salah');setTimeout(()=>b.classList.remove('salah'),450);jawab(false,'Bukan yang itu. Cari yang paling kecil dari yang tersisa.')}};
    meja.append(b)});
  p.append(meja,el('div','petunjuk','🔢 Kecil → besar'));
}
function pasarHarga(lv){
  const [e,nama,h]=pick(DAGANGAN_IKAN.filter(x=>x[2]<=(lv===2?2000:2500))),k=rnd(2,lv===2?3:4),t=h*k;
  setSoal(`1 ${e} = <b>${rp(h)}</b>. Beli ${k} ekor, berapa?`,`Satu ${nama} harganya ${terbilang(h)} rupiah. Ibu membeli ${terbilang(k)} ekor. Berapa harganya?`);
  const p=P(),meja=el('div','meja');
  for(let i=0;i<k;i++)meja.append(el('div','etalase',`<span class="em">${e}</span><span class="tag">${rp(h)}</span>`));
  p.append(el('div','orang',pick(PEMBELI)),meja,el('div','petunjuk','💡 Jumlahkan harga setiap ekor'));
  tombolOpsi(p,opsiAngka(t,500,500),t,rp,true);
}

/* ---------- stiker ---------- */
function bukaStiker(){
  show('stiker');const g=$('#gridStiker');g.innerHTML='';
  STIKER.forEach((s,i)=>g.append(el('div','slot'+(i<state.stiker?' dapat':' kunci'),i<state.stiker?s:'❔')));
  const lagi=5-(state.bintang%5);
  $('#stikerInfo').textContent=state.stiker>=STIKER.length?'Wah, semua stiker sudah terkumpul! 🏆':`Kumpulkan ${lagi} bintang lagi untuk stiker berikutnya.`;
  speak(state.stiker?`Kamu punya ${terbilang(state.stiker)} stiker!`:'Ayo kumpulkan bintang untuk dapat stiker!');
}

/* ---------- orang tua ---------- */
function gerbang(){
  const a=rnd(6,9),b=rnd(6,9);
  overlay(`<h2>👪 Khusus Orang Tua</h2><p>Jawab dulu: <b>${a} × ${b}</b> = ?</p><input id="gate" class="inp" inputmode="numeric" autocomplete="off"><p class="err" id="gerr"></p><div class="mini"><button class="big biru" onclick="cekGerbang(${a*b})">Masuk</button><button class="big putih" onclick="tutup()">Batal</button></div>`);
  setTimeout(()=>{const i=$('#gate');if(i){i.focus();i.onkeydown=ev=>{if(ev.key==='Enter')cekGerbang(a*b)}}},50);
}
function cekGerbang(v){if(+$('#gate').value===v){tutup();bukaOrtu()}else $('#gerr').textContent='Jawaban belum tepat.'}
const KET={kebun:['Menanam & menghitung 1–5','Sampai 10, tambah & kurang','Sampai 15–18'],warung:['Ambil barang, bayar ≤ Rp3.000','Bayar ≤ Rp5.000, menjumlah harga','Bayar ≤ Rp10.000, kembalian'],pasar:['Tangkap ≤ 5, banding, urut 3 ikan','Pilih jenis ikan, urut 4, harga per ekor','Sampai 15, urut 5 ikan, beli 4 ekor']};
function bukaOrtu(){
  show('ortu');const s=state.stat,pct=x=>x.b+x.s?Math.round(x.b/(x.b+x.s)*100)+'%':'–',menit=Math.round((state.detik[tglKey()]||0)/60);
  const selLv=m=>`<select onchange="state.level.${m}=+this.value;save();updateHeader();bukaOrtu()">${[1,2,3].map(l=>`<option value="${l}"${state.level[m]===l?' selected':''}>Level ${l} – ${KET[m][l-1]}</option>`).join('')}</select>`;
  $('#ortuIsi').innerHTML=`
  <div class="panel"><h3>📊 Kemajuan</h3>
    <table class="tbl"><tr><th></th><th>🌳 Kebun</th><th>🏪 Warung</th><th>🐟 Pasar</th></tr>
    <tr><td>Level sekarang</td><td>${state.level.kebun}</td><td>${state.level.warung}</td><td>${state.level.pasar}</td></tr>
    <tr><td>Jawaban benar</td><td>${s.kebun.b}</td><td>${s.warung.b}</td><td>${s.pasar.b}</td></tr>
    <tr><td>Percobaan salah</td><td>${s.kebun.s}</td><td>${s.warung.s}</td><td>${s.pasar.s}</td></tr>
    <tr><td>Ketepatan</td><td>${pct(s.kebun)}</td><td>${pct(s.warung)}</td><td>${pct(s.pasar)}</td></tr></table>
    <p>⏱️ Waktu main hari ini: <b>${menit} menit</b><br>⭐ Bintang: <b>${state.bintang}</b> · 🎁 Stiker: <b>${state.stiker}/${STIKER.length}</b></p>
    <p class="kecilteks">Level naik otomatis setelah 3 jawaban benar berturut-turut, dan turun setelah 3 kali salah berturut-turut.</p></div>
  <div class="panel"><h3>⚙️ Pengaturan</h3>
    <div class="set"><span>Suara & narasi</span><button class="big ${state.suara?'biru':'putih'}" style="font-size:1rem;padding:6px 14px" onclick="state.suara=!state.suara;save();bukaOrtu()">${state.suara?'🔊 Nyala':'🔇 Mati'}</button></div>
    <div class="set"><span>Pengingat istirahat setiap</span><select onchange="state.batas=+this.value;save()">${[10,15,20,30].map(m=>`<option value="${m}"${state.batas===m?' selected':''}>${m} menit</option>`).join('')}</select></div>
    <div class="set"><span>Level Kebun</span>${selLv('kebun')}</div>
    <div class="set"><span>Level Warung</span>${selLv('warung')}</div>
    <div class="set"><span>Level Pasar Ikan</span>${selLv('pasar')}</div>
    <div class="set"><span>Hapus semua kemajuan</span><button class="big merah" style="font-size:1rem;padding:6px 14px" id="btnReset" onclick="resetData(this)">Reset</button></div>
    <p class="kecilteks">Data tersimpan di browser perangkat ini saja.</p></div>
  <div class="mini"><button class="big" onclick="keBeranda()">🏠 Kembali</button></div>`;
}
function resetData(b){if(b.dataset.y){const suara=state.suara,batas=state.batas;state=JSON.parse(JSON.stringify(BAWAAN));state.suara=suara;state.batas=batas;save();updateHeader();bukaOrtu()}else{b.dataset.y=1;b.textContent='Yakin? Ketuk lagi'}}

/* ---------- pengingat istirahat ---------- */
let sesi=0;
setInterval(()=>{
  if(!$('#game').classList.contains('on')||$('#overlay').classList.contains('on')||document.hidden)return;
  sesi++;const k=tglKey();state.detik[k]=(state.detik[k]||0)+1;if(sesi%10===0)save();
  if(sesi>=state.batas*60){sesi=0;save();istirahat()}
},1000);
function istirahat(){
  let s=60;
  overlay(`<div class="ovemoji">🧃🤸</div><h2>Waktunya istirahat!</h2><p>Minum air, regangkan badan, dan lihat yang jauh-jauh dulu ya.</p><div class="hitung" id="cd">60</div><div class="mini"><button class="big biru" id="btnIst" disabled onclick="tutup()">Main lagi</button><button class="big putih" onclick="keBeranda()">🏠 Selesai</button></div>`);
  speak('Waktunya istirahat! Ayo minum air dan regangkan badan.');
  const t=setInterval(()=>{s--;const c=$('#cd'),b=$('#btnIst');if(!c){clearInterval(t);return}c.textContent=s;if(s<=0){clearInterval(t);if(b)b.disabled=false;c.textContent='✅'}},1000);
}

updateHeader();
</script>
